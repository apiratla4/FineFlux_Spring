spring.application.name=${SPRING_APPLICATION_NAME:fineflux}
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb+srv://finefluxtesting:finefluxtesting123@finefluxtesting.ttyqwvc.mongodb.net/?appName=FineFluxTesting}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:Fos_FineFlux}
spring.data.mongodb.auto-index-creation=true

# MongoDB Timezone Configuration - Store all dates in IST (Asia/Kolkata)
spring.data.mongodb.field-naming-strategy=org.springframework.data.mapping.model.SnakeCaseFieldNamingStrategy
spring.jackson.time-zone=${SPRING_JACKSON_TIMEZONE:Asia/Kolkata}
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false

logging.level.com.pulse.fineflux=${LOGGING_LEVEL_ROOT:INFO}
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
logging.pattern.console=%-5level [%thread] %logger{36} [%X{correlationId}] - %msg%n
spring.mail.host=${SPRING_MAIL_HOST:smtp.hostinger.com}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:reset@fineflux.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:Reset@!23}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false
spring.mail.from=${SPRING_MAIL_FROM:reset@fineflux.com}
logging.level.org.springframework.mail=DEBUG

# Google Cloud Storage configuration
gcs.bucket.name=${GCS_BUCKET_NAME:pulse-dev}
gcs.bucket.serviceAccount.filename=${GCS_BUCKET_SERVICE_ACCOUNT_FILENAME:fineflux-db8790196c53.json}
gcs.service.account.json=${GCS_SERVICE_ACCOUNT_JSON:}

# CORS Configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,https://fineflux.com,https://*.fineflux.com}

